name: Thử nguồn giá (tạm)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance requests pandas
      - name: Thử nguồn
        shell: python
        run: |
          import time, requests, datetime as dt
          import yfinance as yf
          now = dt.datetime.now(dt.timezone.utc)
          print("NOW UTC", now.isoformat())
          H = {"User-Agent": "fxbot/1.0"}
          def t(name, fn):
              try:
                  t0 = time.time(); r = fn(); print(f"== {name} ({time.time()-t0:.1f}s):", str(r)[:600])
              except Exception as e:
                  print(f"== {name} LỖI:", repr(e)[:300])
          def sq(inst):
              j = requests.get(f"https://forex-data-feed.swissquote.com/public-quotes/bboquotes/instrument/{inst}", headers=H, timeout=15).json()
              out = []
              for p in j[:4]:
                  for s in p.get("spreadProfilePrices", [])[:1]:
                      ts = p.get("ts")
                      out.append((p.get("topo", {}).get("platform"), s.get("bid"), s.get("ask"),
                                  dt.datetime.fromtimestamp(ts / 1000, dt.timezone.utc).isoformat() if ts else None))
              return out
          for i in ["XAU/USD", "GBP/JPY", "EUR/USD"]:
              t("swissquote " + i, lambda i=i: sq(i))
          t("gold-api.com", lambda: requests.get("https://api.gold-api.com/price/XAU", headers=H, timeout=15).text)
          t("stooq quote", lambda: requests.get("https://stooq.com/q/l/?s=xauusd&f=sd2t2ohlc&h&e=csv", headers=H, timeout=15).text)
          def yl(tk, iv, per):
              d = yf.download(tk, interval=iv, period=per, progress=False, auto_adjust=False, threads=False)
              if d is None or d.empty:
                  return "rỗng"
              c = d["Close"]
              c = c.iloc[:, 0] if hasattr(c, "columns") else c
              return [(str(i), round(float(v), 3)) for i, v in c.tail(3).items()], len(d)
          for tk in ["GC=F", "XAUUSD=X", "GBPJPY=X"]:
              t(f"yahoo {tk} 1m", lambda tk=tk: yl(tk, "1m", "1d"))
              t(f"yahoo {tk} 60m", lambda tk=tk: yl(tk, "60m", "5d"))
